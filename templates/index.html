<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Tweet Sentiment Analysis</h1>

    <form method="POST">
        <textarea name="tweet" placeholder="Enter Tweet"></textarea>
        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
    <h2>{{ prediction }}</h2>
    {% endif %}
</div>

</body>
</html>
